<h2 class="titulo-pagina">Picking</h2>

<section class="card-picking">

  <div class="topo-picking">
    <div>
      <h3 class="subtitulo">Pedidos Abertos para Separação</h3>
      <p>Produtos iguais são agrupados para separação FIFO/FEFO com endereço físico.</p>
    </div>

    <div class="acoes-topo-picking">
      <button onclick="imprimirPickingSelecionados()">
        🖨 Imprimir Selecionados
      </button>

      <button onclick="carregarPicking()">
        🔄 Atualizar
      </button>
    </div>
  </div>

  <div id="resumoPicking" class="resumo-picking"></div>

  <div class="tabela-container">
    <table class="tabela-picking">
      <thead>
        <tr>
          <th>
            <input type="checkbox" id="checkTodosPicking" onchange="selecionarTodosPicking()">
          </th>
          <th>Produto</th>
          <th>SKU</th>
          <th>Total a Separar</th>
          <th>Estoque</th>
          <th>Endereço</th>
          <th>Status</th>
          <th>Detalhes</th>
        </tr>
      </thead>

      <tbody id="listaPicking">
        <tr>
          <td colspan="8">Carregando picking...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <button class="btn-gerar-picking" id="btnIniciarPicking" onclick="iniciarSeparacaoPicking()">
    Iniciar Picking
  </button>

</section>
