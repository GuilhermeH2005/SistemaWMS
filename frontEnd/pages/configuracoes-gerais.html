<h2 class="titulo-pagina">Categorias e Cores</h2>

<section class="card-formulario">
  <h3 class="subtitulo">Cadastrar Categoria</h3>

  <form id="formCategoria" class="form-config-simples">
    <input type="text" id="nomeCategoria" placeholder="Nome da categoria" required>
    <button type="submit">Salvar Categoria</button>
  </form>
</section>

<section class="card-lista">
  <h3 class="subtitulo">Categorias Cadastradas</h3>
  <ul id="listaCategorias"></ul>
</section>

<section class="card-formulario">
  <h3 class="subtitulo">Cadastrar Cor</h3>

  <form id="formCor" class="form-config-simples">
    <input type="text" id="nomeCor" placeholder="Nome da cor" required>
    <button type="submit">Salvar Cor</button>
  </form>
</section>

<section class="card-lista">
  <h3 class="subtitulo">Cores Cadastradas</h3>
  <ul id="listaCores"></ul>
</section>

<section class="card-formulario">
  <h3 class="subtitulo">Cadastrar Cargo</h3>

  <form id="formCargo" class="form-config-simples">
    <input
      type="text"
      id="nomeCargo"
      placeholder="Nome do cargo"
      required
    >

    <button type="submit">
      Salvar Cargo
    </button>
  </form>
</section>

<section class="card-lista">
  <h3 class="subtitulo">Cargos Cadastrados</h3>

  <ul id="listaCargos"></ul>
</section>
