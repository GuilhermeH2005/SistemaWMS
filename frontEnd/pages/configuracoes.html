<div class="configuracoes-container">

  <h1>Trocar Senha</h1>

  <section class="card-configuracoes">

    <form id="formConfiguracoes">

      <div class="grid-config">

        <div class="campo-form">
          <label for="configLogin">Usuário</label>
          <input
            type="text"
            id="configLogin"
            readonly
          >
        </div>

        <div class="campo-form">
          <label for="senhaAtual">Senha Atual</label>
          <input
            type="password"
            id="senhaAtual"
            required
          >
        </div>

        <div class="campo-form">
          <label for="senha">Nova Senha</label>

          <div class="senha-container">
            <input
              type="password"
              id="senha"
              placeholder="Nova Senha"
              required
            >

            <button
              type="button"
              class="btn-olho"
              onclick="alternarSenha('senha', this)"
            >
              👁️
            </button>
          </div>
        </div>

        <div class="campo-form">
          <label for="confirmar_senha">Confirmar Senha</label>

          <div class="senha-container">
            <input
              type="password"
              id="confirmar_senha"
              placeholder="Confirme a senha"
              required
            >

            <button
              type="button"
              class="btn-olho"
              onclick="alternarSenha('confirmar_senha', this)"
            >
              👁️
            </button>
          </div>
        </div>

      </div>

      <button
        type="submit"
        class="btn-salvar"
      >
        Salvar Alterações
      </button>

    </form>

  </section>

</div>
