<div class="configuracoes-container">

  <h1>Trocar Senha</h1>

  <section class="card-configuracoes">

    <form id="formConfiguracoes">

      <div class="grid-config">

        <div class="grupo-form">

          <label>Usuário</label>

          <input
            type="text"
            id="configLogin"
            readonly
          >

        </div>

        <div class="grupo-form">

          <label>Senha Atual</label>

          <input
            type="password"
            id="senhaAtual"
            required
          >

        </div>

        <div class="senha-container">
  <input
    type="password"
    id="senha"
    placeholder="Nova Senha"
    required
  >

  <button
    type="button"
    class="btn-olho"
    onclick="alternarSenha('senha', this)"
  >
    👁️
  </button>
</div>

        <div class="senha-container">
  <input
    type="password"
    id="confirmar_senha"
    placeholder="Confirme a senha"
    required
  >

  <button
    type="button"
    class="btn-olho"
    onclick="alternarSenha('confirmar_senha', this)"
  >
    👁️
  </button>
</div>

      </div>

      <button
        type="submit"
        class="btn-salvar"
      >
        Salvar Alterações
      </button>

    </form>

  </section>

</div>
