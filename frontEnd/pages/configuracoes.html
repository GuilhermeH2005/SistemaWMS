<div class="configuracoes-container">

  <h1>Trocar Senha</h1>

  <section class="card-configuracoes">

    <form id="formConfiguracoes">

      <div class="grid-config">

        <div class="grupo-form">

          <label>Usuário</label>

          <input
            type="text"
            id="configLogin"
            readonly
          >

        </div>

        <div class="grupo-form">

          <label>Senha Atual</label>

          <input
            type="password"
            id="senhaAtual"
            required
          >

        </div>

        <div class="grupo-form">

          <label>Nova Senha</label>

          <input
            type="password"
            id="novaSenha"
            required
          >

        </div>

        <div class="grupo-form">

          <label>Confirmar Nova Senha</label>

          <input
            type="password"
            id="confirmarSenha"
            required
          >

        </div>

      </div>

      <button
        type="submit"
        class="btn-salvar"
      >
        Salvar Alterações
      </button>

    </form>

  </section>

</div>
