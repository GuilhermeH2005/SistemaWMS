<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ajuste Manual de Estoque - LG Logística</title>
</head>
<body>

  <div class="container">

    <div class="topo">
      <div>
        <h1>Ajuste Manual de Estoque</h1>
        <p>Realize correções manuais no estoque com registro de auditoria.</p>
      </div>

    </div>

    <section class="card">
      <h2>Novo Ajuste</h2>

      <form id="formAjuste">

        <div class="grid">

          <div class="campo">
            <label for="produto_id">Produto</label>
            <select id="produto_id" required>
              <option value="">Selecione um produto</option>
            </select>
          </div>

          <div class="campo">
            <label for="estoque_atual">Estoque Atual</label>
            <input type="number" id="estoque_atual" readonly>
          </div>

          <div class="campo">
            <label for="tipo">Tipo de Ajuste</label>
            <select id="tipo" required>
              <option value="">Selecione</option>
              <option value="ENTRADA">Entrada Manual</option>
              <option value="SAIDA">Saída Manual</option>
            </select>
          </div>

          <div class="campo">
            <label for="quantidade">Quantidade Ajustada</label>
            <input type="number" id="quantidade" min="1" required>
          </div>

          <div class="campo campo-full">
            <label for="motivo">Motivo</label>
            <select id="motivo" required>
              <option value="">Selecione o motivo</option>
              <option value="Divergência na conferência">Divergência na conferência</option>
              <option value="Correção de contagem física">Correção de contagem física</option>
              <option value="Produto avariado">Produto avariado</option>
              <option value="Perda identificada">Perda identificada</option>
              <option value="Erro em lançamento anterior">Erro em lançamento anterior</option>
              <option value="Ajuste administrativo">Ajuste administrativo</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <div class="campo campo-full">
            <label for="observacao">Observação</label>
            <textarea id="observacao" rows="4" placeholder="Descreva detalhes do ajuste, se necessário"></textarea>
          </div>

        </div>

        <div class="acoes">
          <button type="submit" class="btn-salvar">Salvar Ajuste</button>
          <button type="reset" class="btn-limpar">Limpar</button>
        </div>

      </form>
    </section>

    <section class="card">
      <h2>Histórico de Ajustes</h2>

      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Produto</th>
              <th>Tipo</th>
              <th>Anterior</th>
              <th>Ajuste</th>
              <th>Novo</th>
              <th>Motivo</th>
              <th>Usuário</th>
            </tr>
          </thead>
          <tbody id="tabelaAjustes">
            <tr>
              <td colspan="8">Carregando ajustes...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

</body>
</html>
