<h2 class="titulo-pagina">Cadastro de Clientes</h2>

<section class="card-cliente">

  <h3 class="subtitulo">Novo Cliente</h3>

  <form id="formCliente" class="form-cliente">

    <input type="hidden" id="cliente_id">

    <div class="campo-form">
      <label for="razao_social">Razão Social</label>
      <input
        type="text"
        id="razao_social"
        placeholder="Razão Social"
        required
      >
    </div>

    <div class="campo-form">
      <label for="nome_fantasia">Nome Fantasia</label>
      <input
        type="text"
        id="nome_fantasia"
        placeholder="Nome Fantasia"
      >
    </div>

    <div class="campo-form">
      <label for="cnpj">CNPJ</label>
      <input
        type="text"
        id="cnpj"
        placeholder="CNPJ"
        maxlength="18"
        required
      >
    </div>

    <div class="campo-form">
      <label for="inscricao_estadual">Inscrição Estadual</label>
      <input
        type="text"
        id="inscricao_estadual"
        placeholder="Inscrição Estadual"
      >
    </div>

    <div class="campo-form">
      <label for="telefone">Telefone</label>
      <input
        type="text"
        id="telefone"
        placeholder="Telefone"
      >
    </div>

    <div class="campo-form">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        placeholder="E-mail"
      >
    </div>

    <div class="campo-form">
      <label for="cep">CEP</label>
      <input
        type="text"
        id="cep"
        placeholder="CEP"
        maxlength="10"
      >
    </div>
    
<div class="campo-form">
  <label for="rua">Rua</label>
  <input
    type="text"
    id="rua"
    placeholder="Rua"
  >
</div>

    <div class="campo-form">
      <label for="numero">Número</label>
      <input
        type="text"
        id="numero"
        placeholder="Número"
      >
    </div>

    <div class="campo-form">
      <label for="bairro">Bairro</label>
      <input
        type="text"
        id="bairro"
        placeholder="Bairro"
      >
    </div>

    <div class="campo-form">
      <label for="cidade">Cidade</label>
      <input
        type="text"
        id="cidade"
        placeholder="Cidade"
      >
    </div>

    <div class="campo-form">
      <label for="estado">Estado</label>
      <input
        type="text"
        id="estado"
        placeholder="UF"
        maxlength="2"
      >
    </div>

    <div class="campo-form" id="campoStatusCliente" style="display: none;">
  <label for="ativo">Status</label>

  <select id="ativo">
    <option value="S">Ativo</option>
    <option value="N">Inativo</option>
  </select>
</div>

    <div class="acoes-form">
      <button type="submit" class="btn-salvar">
        Salvar Cliente
      </button>

      <button
        type="button"
        class="btn-limpar"
        onclick="limparFormularioCliente()"
      >
        Limpar
      </button>
    </div>

  </form>

</section>

<section class="card-lista">

  <div class="topo-lista">
    <h3 class="subtitulo">Clientes Cadastrados</h3>
  </div>

  <div class="barra-busca-padrao">
  <input type="number" id="buscarClienteId" placeholder="ID">
  <input type="text" id="buscarClienteNome" placeholder="Nome / Razão social">
  <input type="text" id="buscarClienteCnpj" placeholder="CNPJ">

  <button type="button" onclick="carregarClientes()">🔍 Buscar</button>
  <button type="button" onclick="limparBuscaClientes()">🧹 Limpar</button>
</div>

  <div class="tabela-container">

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Razão Social</th>
          <th>Nome Fantasia</th>
          <th>CNPJ</th>
          <th>Cidade</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="listaClientes">
        <tr>
          <td colspan="7">
            Carregando clientes...
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</section>
