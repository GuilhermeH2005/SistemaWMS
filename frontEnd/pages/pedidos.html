<h2 class="titulo-pagina">Pedidos de Cliente</h2>

<section class="card-pedido">
  <h3 class="subtitulo">Novo Pedido</h3>

  <form id="formPedido" class="form-pedido">

    <div class="campo-form">
      <label for="cliente_id">Cliente</label>
      <select id="cliente_id" required>
        <option value="">Selecione o cliente</option>
      </select>
    </div>

    <div class="campo-form campo-observacao">
      <label for="observacao">Observação</label>
      <input
        type="text"
        id="observacao"
        placeholder="Observação do pedido"
      >
    </div>

  </form>

  <div class="area-itens-pedido">

    <h3 class="subtitulo">Itens do Pedido</h3>

    <div class="form-item-pedido">

      <div class="campo-form">
        <label for="produtoBuscaPedido">Produto</label>
        <input
          type="text"
          id="produtoBuscaPedido"
          list="listaProdutosPedido"
          placeholder="Digite o produto ou SKU"
        >

        <datalist id="listaProdutosPedido"></datalist>

        <input type="hidden" id="produto_id_pedido">
      </div>

      <div class="campo-form">
        <label for="quantidadePedido">Quantidade</label>
        <input
          type="number"
          id="quantidadePedido"
          min="1"
          placeholder="Quantidade"
        >
      </div>

      <button
        type="button"
        onclick="adicionarItemPedido()"
      >
        Adicionar Item
      </button>

    </div>

    <div class="tabela-container">
      <table class="tabela-pedidos">
        <thead>
          <tr>
            <th>Produto</th>
            <th>SKU</th>
            <th>Qtd</th>
            <th>Estoque Atual</th>
            <th>Ação</th>
          </tr>
        </thead>

        <tbody id="listaItensPedido">
          <tr>
            <td colspan="5">Nenhum item adicionado.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <button
      type="button"
      class="btn-salvar-pedido"
      onclick="salvarPedido()"
    >
      Salvar Pedido
    </button>

  </div>

</section>

<section class="card-lista">
  <div class="topo-lista-pedido">
    <h3 class="subtitulo">Pedidos Cadastrados</h3>

    <input
      type="text"
      id="buscarPedido"
      placeholder="Buscar por cliente, status ou ID..."
      oninput="carregarPedidos()"
    >
  </div>

  <div class="tabela-container">
    <table class="tabela-pedidos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Data</th>
          <th>Status</th>
          <th>Itens</th>
          <th>Observação</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="listaPedidos">
        <tr>
          <td colspan="7">Carregando pedidos...</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
