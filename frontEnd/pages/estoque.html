<h2 class="titulo-pagina">
  Controle de Estoque
</h2>

<section class="card-lista-estoque">

  <div class="topo-estoque">

    <h3>Produtos em Estoque</h3>

    <input
      type="text"
      id="buscarEstoque"
      placeholder="Buscar produto..."
      onkeyup="filtrarEstoque()"
    >

  </div>

  <div class="tabela-estoque-container">

    <table class="tabela-estoque">

      <thead>

        <tr>
          <th>SKU</th>
          <th>Produto</th>
          <th>Categoria</th>
          <th>Fornecedor</th>
          <th>Estoque</th>
          <th>Mínimo</th>
          <th>Status</th>
          <th>Custo</th>
          <th>Venda</th>
          <th>Total Estoque Custo</th>
          <th>Volume Total</th>
        </tr>

      </thead>

      <tbody id="listaEstoque"></tbody>

    </table>

  </div>

</section>
