<h2 class="titulo-pagina">Cadastro de Funcionários</h2>

<section class="card-formulario">
  <h3 class="subtitulo">Novo Funcionário</h3>

  <form id="formFuncionario" class="form-funcionario">

    <div class="campo-form">
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Nome" required>
    </div>

    <div class="campo-form">
      <label for="cpf">CPF</label>
      <input type="text" id="cpf" placeholder="CPF" required>
    </div>

    <div class="campo-form">
      <label for="rg">RG</label>
      <input type="text" id="rg" placeholder="RG">
    </div>

    <div class="campo-form">
      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" placeholder="Telefone" required>
    </div>

    <div class="campo-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="E-mail" required>
    </div>

    <div class="campo-form">
      <label for="cargo_id">Cargo</label>
      <select id="cargo_id">
        <option value="">Selecione o cargo</option>
      </select>
    </div>

    <div class="campo-form">
      <label for="rua">Rua</label>
      <input type="text" id="rua" placeholder="Rua" required>
    </div>

    <div class="campo-form">
      <label for="numero">Número</label>
      <input type="number" id="numero" placeholder="Número" required>
    </div>

    <div class="campo-form">
      <label for="bairro">Bairro</label>
      <input type="text" id="bairro" placeholder="Bairro" required>
    </div>

    <div class="campo-form">
      <label for="cidade">Cidade</label>
      <input type="text" id="cidade" placeholder="Cidade" required>
    </div>

    <div class="campo-form">
      <label for="cep">CEP</label>
      <input type="text" id="cep" placeholder="CEP" required>
    </div>

    <div class="campo-form">
      <label for="data_admissao">Data de Admissão</label>
      <input
        type="text"
        id="data_admissao"
        placeholder="Data de admissão dd/mm/aaaa"
        maxlength="10"
        required
      >
    </div>

    <button type="submit">Cadastrar</button>

  </form>
</section>

<section class="card-lista">
  <h3 class="subtitulo">Funcionários Cadastrados</h3>

  <div class="barra-busca-padrao">
    <input type="number" id="buscarFuncionarioId" placeholder="ID">
    <input type="text" id="buscarFuncionarioNome" placeholder="Nome">
    <input type="text" id="buscarFuncionarioCpf" placeholder="CPF">

    <button type="button" onclick="carregarFuncionarios()">🔍 Buscar</button>
    <button type="button" onclick="limparBuscaFuncionarios()">🧹 Limpar</button>
  </div>

  <ul id="listaFuncionarios">
    <li class="sem-registro">
      Digite ID, nome ou CPF para pesquisar funcionários.
    </li>
  </ul>
</section>
