<h2 class="titulo-pagina">Cadastro de Funcionários</h2>

<section class="card-formulario">
  <h3 class="subtitulo">Novo Funcionário</h3>

  <form id="formFuncionario" class="form-funcionario">
    <input type="text" id="nome" placeholder="Nome" required>
    <input type="text" id="cpf" placeholder="CPF" required>
    <input type="text" id="rg" placeholder="RG">
    <input type="text" id="telefone" placeholder="Telefone" required>
    <input type="email" id="email" placeholder="E-mail" required>

    <input type="text" id="rua" placeholder="Rua" required>
    <input type="number" id="numero" placeholder="Número" required>
    <input type="text" id="bairro" placeholder="Bairro" required>
    <input type="text" id="cidade" placeholder="Cidade" required>
    <input type="text" id="cep" placeholder="CEP" required>

    <input
      type="text"
      id="data_admissao"
      placeholder="Data de admissão dd/mm/aaaa"
      maxlength="10"
      required
    >

    <button type="submit">Cadastrar</button>
  </form>
</section>

<section class="card-lista">
  <h3 class="subtitulo">Funcionários Cadastrados</h3>
  <ul id="listaFuncionarios"></ul>
</section>
