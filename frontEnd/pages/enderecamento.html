<h2 class="titulo-pagina">Endereçamento de Estoque</h2>

<section class="card-formulario">
  <h3 class="subtitulo">Endereçar Produto</h3>

  <form id="formEndereco" class="form-endereco">

    <div class="campo-form">
      <label for="produto_id">Produto</label>
      <select id="produto_id" required>
        <option value="">Selecione um produto pendente</option>
      </select>
    </div>

    <div id="infoProdutoEndereco" class="info-endereco">
      Selecione um produto para ver o saldo pendente.
    </div>

    <button type="button" id="btnSugerirEndereco">
      Sugerir Endereço
    </button>

    <input type="hidden" id="posicao_id">

    <div class="campo-form">
      <label for="rua">Rua</label>
      <select id="rua" required>
        <option value="">Selecione a rua</option>
      </select>
    </div>

    <div class="campo-form">
      <label for="coluna">Coluna</label>
      <select id="coluna" required>
        <option value="">Selecione a coluna</option>
      </select>
    </div>

    <div class="campo-form">
      <label for="nivel">Nível</label>
      <select id="nivel" required>
        <option value="">Selecione o nível</option>
      </select>
    </div>

    <div class="campo-form">
      <label for="endereco">Endereço</label>
      <input
        type="text"
        id="endereco"
        placeholder="Endereço gerado automaticamente"
        readonly
      >
    </div>

    <div class="campo-form">
      <label for="quantidade_unidades">Quantidade de Unidades</label>
      <input
        type="number"
        id="quantidade_unidades"
        min="1"
        placeholder="Quantidade de unidades"
        required
      >
    </div>

    <div class="campo-form">
      <label for="observacao">Observação</label>
      <textarea
        id="observacao"
        placeholder="Observação"
      ></textarea>
    </div>

    <button type="submit">
      Salvar Endereçamento
    </button>

  </form>
</section>

<section class="card-lista">
  <h3 class="subtitulo">Produtos Endereçados</h3>

  <div class="tabela-container">
    <table>
      <thead>
        <tr>
          <th>Endereço</th>
          <th>Produto</th>
          <th>Rua</th>
          <th>Coluna</th>
          <th>Nível</th>
          <th>Qtd. Unidades</th>
          <th>Capacidade Un.</th>
          <th>Ocupação m³</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="listaEnderecos">
        <tr>
          <td colspan="9">Carregando...</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
