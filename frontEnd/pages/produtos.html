<h2 class="titulo-pagina">Cadastro de Produtos</h2>

<section class="card-formulario">

  <h3 class="subtitulo">Novo Produto</h3>

  <form id="formProduto" class="form-produto">

    <input type="text" id="nome" placeholder="Nome do Produto" required>

    <input type="text" id="codigo" placeholder="Código">

    <select id="fornecedor">
      <option value="">Selecione o fornecedor</option>
    </select>

    <input type="number" step="0.01" id="peso" placeholder="Peso (kg)">

    <input type="number" step="0.01" id="volume" placeholder="Volume (m³)">

    <input type="number" id="estoque_minimo" placeholder="Estoque mínimo">

    <button type="submit">Cadastrar</button>

  </form>

</section>

<section class="card-lista">

  <h3 class="subtitulo">Produtos Cadastrados</h3>

  <ul id="listaProdutos"></ul>

</section>
