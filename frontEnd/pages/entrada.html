<h2 class="titulo-pagina">Entrada de Mercadorias</h2>

<section class="card-formulario">

  <h3 class="subtitulo">Cadastro de Entrada</h3>

  <form id="formEntrada" class="form-entrada">

    <div class="campo">
      <label>Produto</label>
      <select id="produto_id" required>
        <option value="">Selecione o produto</option>
      </select>
    </div>

    <div class="campo">
      <label>Quantidade</label>
      <input type="number" id="quantidade" required>
    </div>

    <div class="campo">
      <label>Número da NF</label>
      <input type="text" id="numero_nf" placeholder="Ex: 12345">
    </div>

    <div class="campo">
      <label>Data da NF</label>
      <input type="text" id="data_nf" placeholder="dd/mm/aaaa" maxlength="10">
    </div>

    <div class="campo">
      <label>Lote</label>
      <input type="text" id="lote" placeholder="Ex: L001">
    </div>

    <div class="campo">
      <label>Data de Validade</label>
      <input type="text" id="validade" placeholder="dd/mm/aaaa" maxlength="10">
    </div>

    <button type="submit">Registrar Entrada</button>

  </form>

</section>

<section class="card-lista">

  <h3 class="subtitulo">Entradas Registradas</h3>

  <ul id="listaEntradas"></ul>

</section>
