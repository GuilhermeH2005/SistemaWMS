<h2 class="titulo-pagina">Entrada de Mercadorias</h2>

<section class="card-formulario">
  <h3 class="subtitulo">Nova Entrada</h3>

  <form id="formEntrada" class="form-entrada">

    <select id="produto_id" required>
      <option value="">Selecione o produto</option>
    </select>

    <input type="number" id="quantidade" placeholder="Quantidade Recebida" required>

    <input type="text" id="numero_nf" placeholder="Número da NF" required>

    <input type="text" id="data_nf" placeholder="Data da NF dd/mm/aaaa" maxlength="10" required>

    <input type="text" id="lote" placeholder="Lote" required>

    <input type="text" id="validade" placeholder="Validade dd/mm/aaaa" maxlength="10" required>

    <button type="submit">Registrar Entrada</button>

  </form>
</section>

<section class="card-lista">
  <h3 class="subtitulo">Entradas Registradas</h3>
  <ul id="listaEntradas"></ul>
</section>
