<div class="cadastro-usuario-container">

  <h1>Incluir Usuário</h1>

  <div class="abas-usuario">
    <button type="button" class="aba ativa" onclick="abrirAbaUsuario('dados')">
      Dados Usuário
    </button>

    <button type="button" class="aba" onclick="abrirAbaUsuario('permissoes')">
      Permissões
    </button>
  </div>

  <form id="formUsuario" class="card-cadastro-usuario" novalidate>

    <div id="abaDadosUsuario" class="conteudo-aba ativo">

      <div class="grid-usuario">

        <div class="grupo-form">
          <label for="nomeCompleto">Funcionário</label>
          <select id="nomeCompleto" required>
            <option value="">Selecione o Funcionário</option>
          </select>
        </div>

        <div class="grupo-form">
          <label for="login">Usuário</label>
          <input type="text" id="login" placeholder="Nome de usuário" required>
        </div>

        <div class="grupo-form">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="E-mail" readonly>
        </div>

        <div class="grupo-form">
          <label for="setor">Setor</label>
          <select id="setor">
            <option value="">Selecione o Setor</option>
          </select>
        </div>

        <div class="grupo-form">
          <label for="cargoFuncionario">Cargo</label>
          <input
            type="text"
            id="cargoFuncionario"
            placeholder="Cargo do funcionário"
            readonly>
        </div>

        <div class="grupo-form campo-senha" id="campoSenha">
          <label for="senha">Senha</label>

          <div class="senha-container">
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite a senha"
              required
            >

            <button
              type="button"
              class="btn-olho"
              onclick="alternarSenha('senha', this)"
            >
              👁️
            </button>
          </div>

          <div class="regras-senha">
            <span id="regraTamanho">✔ Mínimo de 8 caracteres</span>
            <span id="regraMaiuscula">✔ Pelo menos 1 letra maiúscula</span>
            <span id="regraNumero">✔ Pelo menos 1 número</span>
            <span id="regraEspecial">✔ Pelo menos 1 caractere especial</span>
          </div>
        </div>

        <div class="grupo-form" id="campoSituacao" style="display: none;">
          <label for="situacao">Situação</label>
          <select id="situacao">
            <option value="ATIVO">ATIVO</option>
            <option value="INATIVO">INATIVO</option>
          </select>
        </div>

      </div>

    </div>

    <div id="abaPermissoesUsuario" class="conteudo-aba">

      <div class="permissoes-grid">

        <div class="grupo-permissao">
          <h3>Usuário</h3>

          <label><input type="checkbox" value="funcionarios"> Funcionário</label>
          <label><input type="checkbox" value="usuarios"> Usuário</label>
          <label><input type="checkbox" value="perfil_acesso"> Perfil de Acesso</label>
        </div>

        <div class="grupo-permissao">
          <h3>Recebimento</h3>

          <label><input type="checkbox" value="fornecedores"> Fornecedor</label>
          <label><input type="checkbox" value="entrada_mercadorias"> Entrada de Mercadorias</label>
          <label><input type="checkbox" value="conferencia"> Conferência</label>
        </div>

        <div class="grupo-permissao">
          <h3>Armazenagem</h3>

          <label><input type="checkbox" value="enderecamento"> Endereçamento</label>
          <label><input type="checkbox" value="posicoes"> Posições</label>
          <label><input type="checkbox" value="cubagem"> Cubagem</label>
          <label><input type="checkbox" value="fifo"> FIFO</label>
        </div>

        <div class="grupo-permissao">
          <h3>Estoque</h3>

          <label><input type="checkbox" value="produtos"> Produtos</label>
          <label><input type="checkbox" value="balanceamento"> Balanceamento</label>
          <label><input type="checkbox" value="ajustes_estoque"> Ajuste</label>
          <label><input type="checkbox" value="alerta_estoque"> Alerta de Mínimo</label>
        </div>

        <div class="grupo-permissao">
          <h3>Picking</h3>
          <label><input type="checkbox" value="picking"> Picking</label>
        </div>

        <div class="grupo-permissao">
          <h3>Expedição</h3>

          <label><input type="checkbox" value="nota_fiscal"> Nota Fiscal</label>
          <label><input type="checkbox" value="romaneio"> Romaneio</label>
        </div>

        <div class="grupo-permissao">
          <h3>Relatórios</h3>
          <label><input type="checkbox" value="relatorios"> Relatórios</label>
        </div>

        <div class="grupo-permissao">
          <h3>Auditoria</h3>
          <label><input type="checkbox" value="auditoria"> Auditoria</label>
        </div>

        <div class="grupo-permissao">
          <h3>Configuração</h3>

          <label><input type="checkbox" value="setores"> Setor</label>
          <label><input type="checkbox" value="configuracoes"> Trocar Senha</label>
          <label><input type="checkbox" value="configuracoes_gerais"> Configurações Gerais</label>
        </div>

      </div>

    </div>

    <div class="botoes-form">
      <button type="submit" class="btn-salvar">
        Salvar Usuário
      </button>

      <button
        type="button"
        class="btn-voltar"
        onclick="carregarPagina('pages/usuarios.html', 'usuarios')"
      >
        Voltar
      </button>
    </div>

  </form>

</div>
