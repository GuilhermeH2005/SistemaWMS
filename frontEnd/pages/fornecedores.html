<h2 class="titulo-pagina">Cadastro de Fornecedores</h2>

<section class="card-formulario">

  <h3 class="subtitulo">Novo Fornecedor</h3>

  <form id="formFornecedor" class="form-fornecedor">

    <input type="text" id="nome" placeholder="Nome" required required>
    <input type="text" id="cnpj" placeholder="CNPJ" required>
    <input type="text" id="telefone" placeholder="Telefone" required>

    <input type="email" id="email" placeholder="E-mail" required>
    <input type="text" id="rua" placeholder="Rua" required>
    <input type="number" id="numero" placeholder="Número" required>

    <input type="text" id="bairro" placeholder="Bairro"required>
    <input type="text" id="cidade" placeholder="Cidade" required>
    <input type="text" id="cep" placeholder="CEP" required>

    <input type="text" id="inscricao_estadual" placeholder="Inscrição Estadual" required>

    <button type="submit">Cadastrar</button>

  </form>

</section>

<section class="card-lista">

  <h3 class="subtitulo">Fornecedores Cadastrados</h3>

  <ul id="lista"></ul>

</section>
