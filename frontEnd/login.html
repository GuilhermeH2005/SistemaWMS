<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LG Logística WMS</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <main class="login-page">

    <section class="login-left">
      <div class="brand-box">
        <div class="logo-icon">LG</div>

        <h1>LG Logística</h1>

        <p>
          Sistema WMS para gestão de armazém, estoque, recebimento, picking e expedição.
        </p>

        <div class="info-list">
          <span>📦 Controle de Estoque</span>
          <span>🚚 Gestão Logística</span>
          <span>📊 Auditoria e Relatórios</span>
        </div>
      </div>
    </section>

    <section class="login-right">

      <form id="formLogin" class="login-card">

        <h2>Acesso ao Sistema</h2>
        <p class="subtexto">Entre com suas credenciais para continuar</p>

        <div class="form-group">
          <label for="usuario">Usuário</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Digite seu usuário"
            required
          >
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>

          <div class="senha-container">
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              required
            >

            <button
              type="button"
              id="toggleSenha"
              class="btn-olho"
            >
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">
          Entrar
        </button>

        <p id="mensagemErro" class="mensagem-erro"></p>

      </form>

    </section>

  </main>

  <script src="login.js"></script>

</body>
</html>
